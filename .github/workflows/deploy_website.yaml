name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: 'yarn'

      - run: yarn install --immutable

      - name: Require study Supabase configuration for deployment
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build pilot deployment with Supabase
        run: |
          parent_origins="${CEDAR_WATCH_PARENT_ORIGINS:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io}"
          CEDAR_WATCH_PARENT_ORIGINS="$parent_origins" \
          CEDAR_WATCH_BASE_PATH="${VITE_BASE_PATH%/}/cedar-watch-pilot/app/" yarn build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name)) }}
          CEDAR_WATCH_SOURCE_COMMIT: 4b6927b12d212f139d003348b79c912a991bdb8b
          CEDAR_WATCH_PARENT_ORIGINS: ${{ vars.CEDAR_WATCH_PARENT_ORIGINS }}
          CEDAR_WATCH_REQUIRE_PARENT_ORIGINS: 'true'
          VITE_STORAGE_ENGINE: supabase
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: peaceiris/actions-gh-pages@v3
        name: Deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
