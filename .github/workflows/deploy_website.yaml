name: Deploy To GitHub Pages

on:
  workflow_dispatch:

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: 'yarn'

      - run: yarn install --immutable

      - name: Require study Supabase configuration for deployment
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY"
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Reject obvious service-role JWT used as anon key
        env:
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module -e '
            const key = process.env.ANON_KEY ?? "";
            if (!key.startsWith("eyJ")) process.exit(0);
            try {
              const payload = JSON.parse(Buffer.from(key.split(".")[1] ?? "", "base64url").toString("utf8"));
              if (payload.role === "service_role") {
                console.error("Refusing deployment: anon-key setting contains a service-role JWT.");
                process.exit(1);
              }
            } catch {
              // This is a narrow tripwire, not comprehensive JWT validation.
            }
          '

      - name: Build pilot deployment with Supabase
        run: |
          parent_origins="${CEDAR_WATCH_PARENT_ORIGINS:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io}"
          CEDAR_WATCH_PARENT_ORIGINS="$parent_origins" \
          CEDAR_WATCH_BASE_PATH="${VITE_BASE_PATH%/}/cedar-watch-pilot/app/" yarn build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name)) }}
          CEDAR_WATCH_SOURCE_COMMIT: 898f8af4ddc54a09e4a5b8d9a7766b78600b6e7c
          CEDAR_WATCH_PARENT_ORIGINS: ${{ vars.CEDAR_WATCH_PARENT_ORIGINS }}
          CEDAR_WATCH_REQUIRE_PARENT_ORIGINS: 'true'
          VITE_STORAGE_ENGINE: supabase
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
